agent:
  name: sales-assistant
  description: Enterprise sales knowledgebase assistant

llm:
  provider: groq
  model: qwen/qwen3.8-27b
  api_key_env: GROQ_API_KEY
  # base_url: https://api.groq.com/openai/v1   # override to route through a gateway/proxy
  temperature: 0.7

database:
  type: postgresql
  host: ${DB_HOST:-localhost}
  port: 5432
  database: ${DB_NAME:-gadibidi}
  username: ${DB_USER:-postgres}
  password_env: DB_PASSWORD

knowledgebase:
  allowed_schemas:
    - public

  allowed_tables:
    - public.customers
    - public.customer_addresses
    - public.categories
    - public.brands
    - public.products
    - public.product_images
    - public.inventory
    - public.coupons
    - public.orders
    - public.order_items
    - public.payments
    - public.shipments
    - public.reviews
    - public.wishlists
    - public.wishlist_items
  
   

  # Generated by `agentic-kb catalog generate`; descriptions, sample values and relations for the LLM
  catalog_file: catalog.yaml

  table_descriptions:
    public.user: "Contains registered user accounts, phone numbers, roles, and user IDs."
    public.cars: "Contains available cars with model, kilometer (km), selling price, registration details, and car location."

security:
  read_only: true
  max_rows: 1000
  query_timeout_seconds: 30.0

response:
  show_sql: false
  include_sources: true

cache:
  enabled: true
  type: redis
  host: ${REDIS_HOST:-localhost}
  port: 6379
  ttl_seconds: 300

conversation:
  enabled: true
  max_history_turns: 10

